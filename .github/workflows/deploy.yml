name: Deploy

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.target.outputs.version }}
      production: ${{ steps.target.outputs.production }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: target
        run: |
          echo "Building ${GITHUB_REF_NAME#v}"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Deploying to production"
            echo "production=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [prepare]
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: [server, web, web-next]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image env
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRODUCTION: ${{ needs.prepare.outputs.production }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY@L}/${{ matrix.image }}"

          tags=("$image:$VERSION")
          if [ "$PRODUCTION" = true ]; then tags+=("$image:production"); fi

          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAGS=$(IFS=,; echo "${tags[*]}")" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  deploy:
    needs: [prepare, build]
    if: needs.prepare.outputs.production == 'true'
    name: Deploy ${{ needs.prepare.outputs.version }} to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy server
        run: |
          curl --fail-with-body -X POST "${{ secrets.COOLIFY_SERVER_WEBHOOK }}" -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Deploy web
        run: |
          curl --fail-with-body -X POST "${{ secrets.COOLIFY_WEB_WEBHOOK }}" -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Deploy web-next
        run: |
          curl --fail-with-body -X POST "${{ secrets.COOLIFY_WEB_NEXT_WEBHOOK }}" -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
